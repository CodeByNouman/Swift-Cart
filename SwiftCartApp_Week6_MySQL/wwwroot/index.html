<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Shop · SwiftCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="assets/style.css" rel="stylesheet">
  </head>
  <body>
    <div id="nav"></div>
    <main class="container py-4">
      <section class="hero p-4 p-md-5 mb-4">
        <div class="row align-items-center g-4">
          <div class="col-md-7">
            <h1>Shop fast. Pay on delivery. Done.</h1>
            <p class="sub my-3">Fresh stock from local sellers, loaded live from our database.</p>
            <a href="#products" class="btn btn-warning btn-lg">Browse products</a>
          </div>
          <div class="col-md-5 d-none d-md-block">
            <div class="stack">
              <div class="t t1">🎧</div>
              <div class="t t2">⌚</div>
              <div class="t t3">🧥</div>
              <div class="t t4">☕</div>
            </div>
          </div>
        </div>
      </section>
      <div class="d-flex justify-content-between align-items-center mb-3" id="products">
        <h2 class="h4 m-0" id="ttl">Products</h2>
      </div>
      <div class="row g-3" id="grid"></div>
    </main>
    <div id="foot"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/app.js"></script>
    <script>
      $('#grid').innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>';
      loadProducts().then(ok => {
        $('#ttl').textContent = ok ? 'Products (' + PRODUCTS.length + ')' : 'Products';
        $('#grid').innerHTML = !ok
          ? '<div class="col-12 text-center py-5 text-secondary"><i class="bi bi-exclamation-triangle fs-1"></i><p class="mt-2">Could not load products. Check that the database is running.</p></div>'
          : PRODUCTS.map(card).join('');
      });
    </script>
  </body>
</html>
