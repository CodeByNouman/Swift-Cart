<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Seller sign in · SwiftCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="assets/style.css" rel="stylesheet">
  </head>
  <body>
    <div id="nav"></div>
    <main class="container auth-wrap d-flex align-items-center py-4">
      <div class="mx-auto card-s p-4 p-md-5" style="max-width:440px;width:100%">
        <h1 class="h3">Seller sign in</h1>
        <p class="text-secondary">Manage your products and orders.</p>
        <form id="f" novalidate>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="em" class="form-control" required placeholder="store@example.com">
            <div class="invalid-feedback">Enter the email you registered with.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
              <input type="password" id="pw" class="form-control" required minlength="8">
              <button type="button" class="btn btn-outline-dark" id="eye" aria-label="Show password">
                <i class="bi bi-eye"></i>
              </button>
              <div class="invalid-feedback">Password must be at least 8 characters.</div>
            </div>
          </div>
          <div class="d-flex justify-content-between mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rm">
              <label class="form-check-label" for="rm">Keep me signed in</label>
            </div>
            <a href="#" onclick="toast('Reset link sent (demo)');return false">Forgot password?</a>
          </div>
          <button class="btn btn-primary btn-lg w-100">Sign in</button>
        </form>
        <p class="text-center mt-4 mb-0 text-secondary">
          New seller?
          <a href="signup.html">Create a seller account</a>
        </p>
        <p class="text-center small text-secondary mt-3 mb-0">
          Demo seller: demo@swiftcart.pk / Demo@1234
        </p>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/app.js"></script>
    <script>
      $('#eye').onclick = () => {
        const p = $('#pw');
        p.type = p.type == 'password' ? 'text' : 'password';
      };
      const f = $('#f');
      check(f);
      f.addEventListener('valid', async () => {
        const r = await api('/api/auth/login', {
          method: 'POST',
          body: { email: $('#em').value.trim(), password: $('#pw').value, rememberMe: $('#rm').checked }
        });
        if (!r.ok) return toast(r.message || 'Sign in failed', 'danger');
        set('sc_seller', r.data);
        location = 'index.html';
      });
    </script>
  </body>
</html>
